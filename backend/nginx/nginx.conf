user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M; # Phù hợp với max file upload 10MB trong application.yml

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cấu hình chuyển tiếp HTTP (Port 80) -> HTTPS (Port 443)
    server {
        listen 80;
        listen [::]:80;
        server_name api.YOUR_DOMAIN; # Sẽ được thay thế bằng tên miền của bạn (ví dụ: api.aihires.com)

        # Đường dẫn cho Certbot xác thực tên miền (ACME Challenge)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Chuyển hướng tự động toàn bộ traffic HTTP khác sang HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Cấu hình bảo mật HTTPS (Port 443)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.YOUR_DOMAIN; # Sẽ được thay thế bằng tên miền của bạn

        # Cấu hình chứng chỉ Let's Encrypt SSL
        ssl_certificate /etc/letsencrypt/live/api.YOUR_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.YOUR_DOMAIN/privkey.pem;

        # Cấu hình tối ưu bảo mật SSL/TLS (Modern Profile)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "upgrade-insecure-requests; default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # 1. Reverse Proxy cho Spring Boot Backend API
        location / {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket Support (Cần thiết cho chat, notifications)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Tăng timeout cho các API xử lý AI lâu (Gemini API có thể mất 10-30s)
            proxy_connect_timeout 90;
            proxy_send_timeout 90;
            proxy_read_timeout 90;
        }

        # 2. Reverse Proxy cho MinIO API (Phục vụ lưu trữ và tải CV)
        location /ai-hire-resumes/ {
            proxy_pass http://minio:9000/ai-hire-resumes/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Tối ưu hóa truyền tải file lớn
            client_max_body_size 10M;
            proxy_buffering off;
        }

        # 3. Reverse Proxy cho MinIO Console (Giao diện quản trị MinIO - Tùy chọn bảo mật)
        location /minio-admin/ {
            proxy_pass http://minio:9001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
