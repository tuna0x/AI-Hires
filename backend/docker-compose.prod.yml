version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: aih-mysql-prod
    restart: always
    environment:
      MYSQL_DATABASE: ai_hire
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456} # Cho phép ghi đè bằng file .env hoặc env variables
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306" # Chỉ cho phép truy cập local từ EC2 để bảo mật tối đa
    volumes:
      - aih_mysql_prod_data:/var/lib/mysql
    networks:
      - aih-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: aih-redis-prod
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379" # Chỉ cho phép truy cập local
    volumes:
      - aih_redis_prod_data:/data
    networks:
      - aih-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  rabbitmq:
    image: rabbitmq:3.11-management-alpine
    container_name: aih-rabbitmq-prod
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:5672:5672" # Chỉ cho phép truy cập local
      - "127.0.0.1:15672:15672" # Chỉ cho phép truy cập local (quản lý qua SSH Tunnel)
    volumes:
      - aih_rabbitmq_prod_data:/var/lib/rabbitmq
    networks:
      - aih-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio:
    image: minio/minio
    container_name: aih-minio-prod
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000" # MinIO API
      - "127.0.0.1:9001:9001" # MinIO Console
    command: server /data --console-address ":9001"
    volumes:
      - aih_minio_prod_data:/data
    networks:
      - aih-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aih-backend-prod
    restart: always
    expose:
      - "8080" # Chỉ expose nội bộ trong docker network để Nginx proxy qua
    environment:
      - DB_HOST=mysql
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-123456}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-ai-hire-resumes}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - aih-network

  nginx:
    image: nginx:1.25-alpine
    container_name: aih-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    depends_on:
      - backend
    networks:
      - aih-network

  certbot:
    image: certbot/certbot
    container_name: aih-certbot-prod
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit 0 SIGTERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - aih-network

networks:
  aih-network:
    name: aih-network-prod
    driver: bridge

volumes:
  aih_mysql_prod_data:
  aih_redis_prod_data:
  aih_rabbitmq_prod_data:
  aih_minio_prod_data:
  certbot_etc:
  certbot_var:
  webroot:
