version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: aih-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ai_hire
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - aih_mysql_data:/var/lib/mysql

  redis:
    image: redis:7.0-alpine
    container_name: aih-redis
    restart: always
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.11-management-alpine
    container_name: aih-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio
    container_name: aih-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - aih_minio_data:/data

volumes:
  aih_mysql_data:
  aih_minio_data:
