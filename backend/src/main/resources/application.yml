spring:
  application:
    name: AIH
  
  datasource:
    url: jdbc:mysql://localhost:3306/ai_hire?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
    rabbitmq:
      host: localhost
      port: 5672
      username: guest
      password: guest

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

