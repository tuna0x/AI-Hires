name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Backend Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up QEMU (for multi-architecture build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/aih-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/aih-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Private Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.AWS_EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy Deployment Configs to EC2
        run: |
          # Create deployment directory on target EC2 host
          ssh -i ~/.ssh/id_rsa ${{ secrets.AWS_EC2_USERNAME }}@${{ secrets.AWS_EC2_HOST }} "mkdir -p /home/${{ secrets.AWS_EC2_USERNAME }}/ai-hires"
          
          # Copy docker-compose.prod.yml and nginx directory to EC2 host
          scp -i ~/.ssh/id_rsa ./backend/docker-compose.prod.yml ${{ secrets.AWS_EC2_USERNAME }}@${{ secrets.AWS_EC2_HOST }}:/home/${{ secrets.AWS_EC2_USERNAME }}/ai-hires/
          scp -r -i ~/.ssh/id_rsa ./backend/nginx ${{ secrets.AWS_EC2_USERNAME }}@${{ secrets.AWS_EC2_HOST }}:/home/${{ secrets.AWS_EC2_USERNAME }}/ai-hires/

      - name: Inject Production Environment Secrets
        run: |
          # Safe writing of env file from secret onto host
          ssh -i ~/.ssh/id_rsa ${{ secrets.AWS_EC2_USERNAME }}@${{ secrets.AWS_EC2_HOST }} 'cat << "EOF" > /home/${{ secrets.AWS_EC2_USERNAME }}/ai-hires/.env
          ${{ secrets.ENV_PRODUCTION_FILE }}
          EOF'

      - name: Run Docker Compose on EC2
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.AWS_EC2_USERNAME }}@${{ secrets.AWS_EC2_HOST }} "
            cd /home/${{ secrets.AWS_EC2_USERNAME }}/ai-hires
            
            # Log in to Docker Registry
            echo '${{ secrets.DOCKER_HUB_PASSWORD }}' | docker login -u '${{ secrets.DOCKER_HUB_USERNAME }}' --password-stdin
            
            # Pull latest backend image
            docker compose -f docker-compose.prod.yml pull backend
            
            # Restart all services with zero-downtime rolling logic
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Clean up dangling images to save server disk space
            docker image prune -f
          "
